name: E2E

on:
  workflow_dispatch:
  # Repo Next i repo MF app mogą to odpalać po własnym deployu na staging
  # (patrz README.md, sekcja "Wpięcie do CI innych repo").
  repository_dispatch:
    types: [staging-deployed]
  schedule:
    - cron: '0 5 * * *' # nightly, 5:00 UTC

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps

      - run: npx playwright test
        env:
          MARKETING_URL: https://staging.domena.pl
          APP_URL: https://staging-app.domena.pl

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
