name: E2E

on:
  workflow_dispatch:
  # The Next repo and the MF app repo can trigger this after their own
  # staging deploy (see README.md, "Wiring into other repos' CI" section) -
  # either as a workflow_call (see below - preferred, since it gives
  # needs: e2e to gate promote-to-prod in the same run), or as a
  # repository_dispatch (one-way, no feedback - kept as a fallback).
  repository_dispatch:
    types: [staging-deployed]
  schedule:
    - cron: '0 5 * * *' # nightly, 5:00 UTC
  # Lets other repos call this workflow as a plain job
  # (`uses: szczypkaweb/marketplace-e2e/.github/workflows/e2e.yml@main`)
  # instead of a separate, unrelated run. Effect: the calling workflow gets
  # `needs.<job_id>.result` (success/failure) in THE SAME run, so it can
  # directly build a "promote to prod" job on top of it (`needs: e2e`,
  # `if: needs.e2e.result == 'success'`) - without the cross-repo callbacks
  # that repository_dispatch doesn't give you on its own.
  workflow_call:
    inputs:
      marketing_url:
        description: >
          Base URL for tests/marketing and tests/flows (next-app staging
          deploy). No default on purpose (see note below) - OPTIONAL: when
          omitted, both `marketing` and `flows` are skipped entirely, since
          most callers (backend, react-app, frontend-shell) don't know
          next-app's URL and have no business guessing it.
        type: string
        required: false
      app_url:
        description: 'Base URL for tests/app + tests/flows (frontend-shell staging deploy)'
        type: string
        required: false
      api_url:
        description: 'Base URL for the backend (only used by tests/app/auth.spec.ts, e.g. a Cloud Run staging URL)'
        type: string
        required: false
    secrets:
      E2E_DATABASE_URL:
        description: >
          Postgres connection string for seeding/cleaning the tests/app fixture
          user (see tests/app/auth.setup.ts). OPTIONAL: when omitted, the `app`
          project is skipped entirely and only marketing+flows run - this is a
          safe fallback, not a failure, since most callers won't have a staging
          backend+DB to point at yet.
        required: false
      E2E_REPO_CHECKOUT_TOKEN:
        description: >
          Fine-grained PAT (Contents: Read-only on this repo) used to check out
          THIS repo's own code when called cross-repo via workflow_call. The
          ambient GITHUB_TOKEN in the CALLER's context has no read access to
          this repo's contents, even when this repo's Settings -> Actions ->
          Access allows the workflow_call itself to run - those are two
          different permissions. OPTIONAL: falls back to github.token, which
          is enough when this workflow runs on ITS OWN triggers
          (workflow_dispatch/schedule/repository_dispatch), just not when
          invoked from another repo.
        required: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      # Explicit `repository:` is required here, not optional. Without it,
      # actions/checkout defaults to checking out the CALLING repo's content
      # (frontend-shell/react-app/backend - the caller invoked this workflow
      # via workflow_call), not this repo's own - the called job "runs as
      # though part of the caller" by default. That silently checked out a
      # pnpm project with no package-lock.json in place of this repo's own
      # tests, so `npm ci` failed with "no package-lock.json found" - a
      # confusing error that has nothing to do with this repo's actual lockfile.
      - uses: actions/checkout@v4
        with:
          repository: szczypkaweb/marketplace-e2e
          token: ${{ secrets.E2E_REPO_CHECKOUT_TOKEN || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps

      # Each project is included only when the URL(s) it actually needs were
      # supplied - same safe-fallback philosophy as the pre-existing
      # E2E_DATABASE_URL gating below, just extended to marketing/flows too.
      # Previously marketing_url/app_url/api_url had hardcoded
      # `https://staging*.domena.pl` defaults from before next-app/react-app/
      # frontend-shell had any real staging deploy - once backend/react-app/
      # frontend-shell actually started calling this workflow for real, that
      # placeholder domain (which resolves to nothing) turned "no URL
      # provided" into a hard failure instead of a skip. None of those three
      # callers know next-app's URL, so `marketing`/`flows` should always be
      # skipped when called from them - that's expected, not broken.
      #
      # `inputs.*` are only set when this workflow is invoked via
      # workflow_call - on the other triggers (workflow_dispatch/
      # repository_dispatch/schedule) `inputs.*` is empty, so today those
      # triggers only ever run `app` (if E2E_DATABASE_URL is set as this
      # repo's own secret). Pass marketing_url/app_url explicitly via
      # workflow_dispatch once there's a real URL to point at.
      - name: Determine which projects to run
        id: projects
        run: |
          PROJECTS=""
          if [ -n "$MARKETING_URL" ]; then
            PROJECTS="$PROJECTS --project=marketing"
          else
            echo "::notice::marketing_url not set - skipping the 'marketing' project."
          fi
          if [ -n "$E2E_DATABASE_URL" ]; then
            PROJECTS="$PROJECTS --project=app"
          else
            echo "::notice::E2E_DATABASE_URL not set - skipping the 'app' project (needs a live backend + DB). See README.md."
          fi
          if [ -n "$MARKETING_URL" ] && [ -n "$APP_URL" ]; then
            PROJECTS="$PROJECTS --project=flows"
          else
            echo "::notice::marketing_url and/or app_url not set - skipping the 'flows' project (needs both next-app and the MF app)."
          fi
          echo "list=$PROJECTS" >> "$GITHUB_OUTPUT"
        env:
          MARKETING_URL: ${{ inputs.marketing_url }}
          APP_URL: ${{ inputs.app_url }}
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}

      - if: steps.projects.outputs.list != ''
        run: npx playwright test ${{ steps.projects.outputs.list }}
        env:
          MARKETING_URL: ${{ inputs.marketing_url }}
          APP_URL: ${{ inputs.app_url }}
          API_URL: ${{ inputs.api_url }}
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
